# Dependabot configuration (ARCH-AUDIT-V2 C5)
# Keeps pip and npm dependencies up-to-date with weekly PRs.

version: 2
updates:

  # ── Python (pip) ─────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # Ignore transient patches for vendored/internal deps
    ignore:
      - dependency-name: "weebot"  # self-referential, never published
      # browser-use 0.13.x hard-pins aiohttp==3.13.4 and anthropic==0.76.0,
      # which conflict with the aiohttp/anthropic bumps in the same group and
      # make the group PR uninstallable (ResolutionImpossible). Block its
      # minor/major bumps so the rest of the group can still upgrade; patch
      # bumps (e.g. 0.11.x) stay allowed. Revisit when browser-use loosens
      # its pins. See PR #18 / #29.
      - dependency-name: "browser-use"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    # Group minor/patch bumps into single PRs to reduce noise
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── Node.js (npm) ────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/weebot-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
