# Dependabot configuration (ARCH-AUDIT-V2 C5)
# Keeps pip and npm dependencies up-to-date with weekly PRs.

version: 2
updates:

  # ── Python (pip) ─────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # Ignore transient patches for vendored/internal deps
    ignore:
      - dependency-name: "weebot"  # self-referential, never published
      # browser-use 0.13.x hard-pins aiohttp==3.13.4 and anthropic==0.76.0,
      # which conflict with the aiohttp/anthropic bumps in the same group and
      # make the group PR uninstallable (ResolutionImpossible). Block its
      # minor/major bumps so the rest of the group can still upgrade; patch
      # bumps (e.g. 0.11.x) stay allowed. Revisit when browser-use loosens
      # its pins. See PR #18 / #29.
      - dependency-name: "browser-use"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Majors blocked by another package's pin (checked 2026-10-30). Retest when the
      # blocker moves:
      # - anthropic 2.x: browser-use 0.11.13 needs <1.0, and even 0.13.14 needs <2.0 (PR #86).
      # - openai 3.x: browser-use 0.11.13 needs <3.0; 0.13.14 allows <4.0 (PR #90).
      # - uuid-utils 1.x: langchain-core 1.6.13 needs <1.0; 1.7.3 drops the cap (PR #91).
      - dependency-name: "anthropic"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "openai"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "uuid-utils"
        update-types:
          - "version-update:semver-major"
    # Group bumps into single PRs to reduce noise; majors get their own group
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── Node.js (npm) ────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/weebot-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
