# Is main still protected?
#
# Phase A2 of tasks/specs/review_gate_and_residual_work_plan.md.
#
# This deliberately does NOT run on pull_request. Branch protection is a
# property of the repository, not of anyone's change: a contributor cannot fix
# it and must not be blocked by it. Making this a required check would train
# people to route around CI, which is how gates get switched off.
#
# It is expected to be RED until a human applies the ruleset and provides a
# token that can read it back -- see .github/rulesets/README.md. That redness
# is the correct report of the current state, not a broken job. It reports
# success only when it has read the live configuration and found it matching.
name: Protection Drift

on:
  schedule:
    # Daily at 07:00 UTC. Drift is detected within a day of it happening.
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - "scripts/check_branch_protection.py"
      - ".github/workflows/protection-drift.yml"

permissions:
  contents: read

jobs:
  drift:
    name: Branch protection drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Compare live protection against .github/rulesets/main.json
        # No `continue-on-error` and no `|| echo`: this step is the whole job.
        # PROTECTION_READ_TOKEN is a PAT with repository administration:read.
        # The Actions GITHUB_TOKEN cannot be granted that scope through the
        # workflow `permissions:` key, so it is offered only as a fallback that
        # will most likely 403 -- which the script reports as CANNOT VERIFY and
        # fails on, rather than passing.
        env:
          PROTECTION_READ_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_branch_protection.py
