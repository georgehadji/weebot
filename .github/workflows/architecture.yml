name: Architecture Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # browser_use defaults telemetry to ON and phones home to posthog; that
  # client can leave the process unable to exit cleanly after tests finish,
  # which GitHub reports as a job timeout/cancellation rather than a failure.
  ANONYMIZED_TELEMETRY: "false"

jobs:
  lint-and-arch:
    name: Lint + Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install import-linter ruff pip-audit
      - name: Ruff lint (F, E9 — undefined names + syntax)
        run: ruff check weebot/ cli/ --select F821,E9
      - name: Python dependency audit
        # ADVISORY. Known CVEs exist in the dependency tree, so this reports
        # rather than gates. `continue-on-error` instead of `|| echo`: the step
        # keeps its real exit code and is surfaced as a warning, where the shell
        # idiom forged a success and made the signal unreadable.
        continue-on-error: true
        run: pip-audit 2>&1 | head -20
      - name: Run import-linter
        run: make lint-imports
      - name: Secret scan
        run: bash scripts/check-secrets.sh --ci
      - name: Run architecture fitness tests
        run: pytest tests/unit/test_architecture_fitness.py -v --tb=short
      - name: Run security penetration tests
        run: pytest tests/integration/test_security_penetration.py -v --tb=short
      - name: Run event bridge contract tests
        run: pytest tests/integration/test_event_bridge_contract.py -v --tb=short
      - name: Bare env-access ratchet
        # BLOCKING. `make lint-env-access` has been a real ratchet since Wave 0
        # (73 reads, ceiling 73, exits 1 above it) -- but the `|| echo` wrapper
        # discarded that exit code, so the gate Wave 0 built was disarmed by the
        # workflow that ran it. Removing the wrapper costs nothing: the count is
        # at its ceiling and the target exits 0.
        run: make lint-env-access
      - name: Silent except-handler ratchet
        # Blocking above the ceiling only: existing debt does not fail the build,
        # but no new silently-swallowed exception can be added. Previously this
        # gate lived only in `make check` as a grep that could not match the
        # two-line `except X:` / `pass` form, so it reported clean over 139 sites.
        run: python scripts/lint_except_pass.py
      - name: Blocking-I/O-in-async ratchet
        # Same ratchet contract. This gate was a `make check` prerequisite that
        # exited 1, so `make check` was red on a clean checkout, and it appeared
        # nowhere in CI.
        run: python scripts/lint_async_io.py
      - name: Ruleset / workflow consistency
        # BLOCKING, and offline -- no token, no permissions. GitHub validates
        # required-check names against nothing, so renaming a job here leaves
        # .github/rulesets/main.json requiring a context that never reports, and
        # every pull request then waits on it forever with no error saying why.
        # The reverse drift is just as quiet: a new job nobody requires is red
        # while the merge button stays green.
        run: python scripts/check_ruleset_consistency.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install import-linter ruff pip-audit
      - name: Ruff lint (F, E9 — undefined names + syntax)
        run: ruff check weebot/ cli/ --select F821,E9
      - name: Python dependency audit
        # ADVISORY — see the note in the lint-and-arch job.
        continue-on-error: true
        run: pip-audit 2>&1 | head -20
      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --tb=short --cov=weebot --cov-report=term --cov-fail-under=52

  persistence:
    name: Persistence Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run persistence tests
        run: pytest tests/e2e/test_persistence.py -v --tb=short

  cqrs-integration:
    name: CQRS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CQRS handler integration tests
        run: pytest tests/integration/test_cqrs_handlers.py -v --tb=short --timeout=30

  e2e-tests:
    name: E2E / Performance / Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run E2E tests (non-external)
        run: pytest tests/e2e/ -v --tb=short --timeout=60 -m "not external"
      - name: Run performance smoke test
        run: pytest tests/e2e/test_flow_e2e.py::TestConcurrentFlows -v --tb=short --timeout=120
      - name: Run chaos recovery test
        run: pytest tests/e2e/test_flow_e2e.py::TestChaosRecovery -v --tb=short --timeout=60

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: weebot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: weebot-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  # The former single "Security Scan" job is split in two. All three of its
  # steps ended in `|| echo`, so its conclusion was a constant: it could not
  # fail, whatever any scanner found. A required check built on it would have
  # gated nothing. The split makes the distinction structural rather than a
  # shell idiom, so the name on the check tells you whether it can fail.
  #
  # security-advisory  — reports; never gates; MUST NOT be a required check.
  # security-blocking  — genuinely fails; intended to be required.
  security-advisory:
    name: Security Scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit
      - name: pip-audit
        # ADVISORY — known CVEs exist in the dependency tree.
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict 2>&1 | head -20
      - name: npm audit
        # ADVISORY — known advisories exist in weebot-ui deps.
        continue-on-error: true
        run: |
          cd weebot-ui
          npm audit --audit-level=high

  security-blocking:
    name: Security Scan (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit
      - name: Bandit B110 ratchet
        # BLOCKING above the ceiling only. bandit was previously run with
        # `|| echo`, so its 68 findings were discarded and the step could not
        # fail. The pre-existing backlog still does not fail the build, but no
        # new try/except/pass site can be added.
        #
        # The workflow comment here used to claim 71 findings; the measured
        # count is 68, and the ceiling is set from the measurement.
        run: python scripts/lint_bandit_b110.py

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-arch]
    # 10 minutes was only ever enough because the weebot-ui build failed fast
    # on a CSS parse error. With both images building for real, the api image
    # (full Python dependency tree) plus the ui image exceed that budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build weebot-api image
        run: docker build -t weebot-api .
      - name: Build weebot-ui image
        run: docker build -t weebot-ui -f weebot-ui/Dockerfile .
      - name: Frontend dependency audit
        # ADVISORY — known advisories exist in weebot-ui deps.
        continue-on-error: true
        run: |
          cd weebot-ui
          npm audit --audit-level=high
      - name: Start services (no .env — verify crash-free)
        run: |
          export OPENROUTER_API_KEY=ci-test-key
          export ANTHROPIC_API_KEY=ci-test-key
          docker compose -f docker-compose.yml up -d --wait
      - name: Verify API health
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 10 retries"
          exit 1
      - name: Check services running
        if: always()
        run: docker compose ps
      - name: Dump service logs on failure
        if: failure()
        # Without this, a crash-looping container reports only
        # "dependency failed to start: ... is unhealthy" with no cause.
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
