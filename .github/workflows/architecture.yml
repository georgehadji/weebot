name: Architecture Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # browser_use defaults telemetry to ON and phones home to posthog; that
  # client can leave the process unable to exit cleanly after tests finish,
  # which GitHub reports as a job timeout/cancellation rather than a failure.
  ANONYMIZED_TELEMETRY: "false"

jobs:
  lint-and-arch:
    name: Lint + Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install import-linter ruff pip-audit
      - name: Ruff lint (F, E9 — undefined names + syntax)
        run: ruff check weebot/ cli/ --select F,E9
      - name: Python dependency audit
        # Non-blocking — known CVEs exist in the dependency tree.
        # Will become blocking once advisories are addressed (see implementation_plan.md WI-10).
        run: pip-audit 2>&1 | head -20 || echo "pip-audit found advisories (non-blocking)"
      - name: Run import-linter
        run: make lint-imports
      - name: Secret scan
        run: bash scripts/check-secrets.sh --ci
      - name: Run architecture fitness tests
        run: pytest tests/unit/test_architecture_fitness.py -v --tb=short
      - name: Run security penetration tests
        run: pytest tests/integration/test_security_penetration.py -v --tb=short
      - name: Run event bridge contract tests
        run: pytest tests/integration/test_event_bridge_contract.py -v --tb=short

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install import-linter ruff pip-audit
      - name: Ruff lint (F, E9 — undefined names + syntax)
        run: ruff check weebot/ cli/ --select F,E9
      - name: Python dependency audit
        # Non-blocking — known CVEs exist in the dependency tree.
        # Will become blocking once advisories are addressed (see implementation_plan.md WI-10).
        run: pip-audit 2>&1 | head -20 || echo "pip-audit found advisories (non-blocking)"
      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --tb=short -x --cov=weebot --cov-report=term --cov-fail-under=55

  persistence:
    name: Persistence Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run persistence tests
        run: pytest tests/e2e/test_persistence.py -v --tb=short

  cqrs-integration:
    name: CQRS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CQRS handler integration tests
        run: pytest tests/integration/test_cqrs_handlers.py -v --tb=short --timeout=30

  e2e-tests:
    name: E2E / Performance / Chaos Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run E2E tests (non-external)
        run: pytest tests/e2e/ -v --tb=short --timeout=60 -m "not external"
      - name: Run performance smoke test
        run: pytest tests/e2e/test_flow_e2e.py::TestConcurrentFlows -v --tb=short --timeout=120
      - name: Run chaos recovery test
        run: pytest tests/e2e/test_flow_e2e.py::TestChaosRecovery -v --tb=short --timeout=60

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: weebot-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: weebot-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: pip-audit
        # Non-blocking — known CVEs exist in the dependency tree.
        # Will become blocking once advisories are addressed (see implementation_plan.md WI-10).
        run: pip-audit -r requirements.txt --strict 2>&1 | head -20 || echo "pip-audit found advisories (non-blocking)"
      - name: Bandit SAST
        run: bandit -c pyproject.toml -r weebot/ cli/
      - name: npm audit
        run: |
          cd weebot-ui
          npm audit --audit-level=high 2>&1 || echo "npm audit found advisories (non-blocking)"

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-arch]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build weebot-api image
        run: docker build -t weebot-api .
      - name: Build weebot-ui image
        run: docker build -t weebot-ui -f weebot-ui/Dockerfile .
      - name: Frontend dependency audit
        # Non-blocking — known advisories exist in weebot-ui deps.
        # Will become blocking once advisories are addressed (see implementation_plan.md WI-10).
        run: |
          cd weebot-ui
          npm audit --audit-level=high 2>&1 || echo "npm audit found advisories (non-blocking in CI)"
      - name: Start services (no .env — verify crash-free)
        run: |
          export OPENROUTER_API_KEY=ci-test-key
          export ANTHROPIC_API_KEY=ci-test-key
          docker compose -f docker-compose.yml up -d --wait
      - name: Verify API health
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 10 retries"
          exit 1
      - name: Check services running
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
