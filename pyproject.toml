[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weebot"
dynamic = ["version"]
description = "Production-grade autonomous AI agent framework with Clean Architecture, CQRS, and multi-model orchestration"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Weebot Contributors"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Pinned dependencies are managed in requirements.txt (the deployment lockfile).
    # pyproject.toml carries minimal metadata for PEP 517/518 build isolation.
    # See WI-05 in implementation_plan.md for the design rationale.
]

[project.scripts]
weebot = "cli.main:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["weebot*", "cli*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "Output/",
    "weebot/GitNexus-main/",
    "scripts/",
    "examples/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear (includes B110 try-except-pass)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
ignore = [
    # B008: Depends() in FastAPI dependency injection — safe pattern
    "B008",
    # SIM102: collapsible if — style preference
    "SIM102",
    # SIM108: ternary — sometimes less readable
    "SIM108",
    # UP007: X | Y union syntax — requires Python 3.10+ call sites
    "UP007",
]

# B110: try-except-pass without logging.
# All bare `except: pass` blocks must log at least at DEBUG level.
# Violations are errors (not warnings) to block commits via pre-commit.
[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use broad catches without logging
# B011: bare except: pass without logging — requires logging in production code
"tests/**/*.py" = ["B011", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 60
addopts = "--tb=short --strict-markers -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks end-to-end tests (CLI subprocess, slow)",
    "external: marks tests that require live network/credentials (skip in CI unless ATOMICMAIL_TEST_LIVE=1)",
]

[tool.bandit]
skips = []
exclude_dirs = [".venv", "Output", "weebot/GitNexus-main"]
# B110: try-except-pass  — require logging in all except blocks
tests = ["B110"]
