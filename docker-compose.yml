# Weebot — Docker Compose
# 3 services: Valkey (event bus), API (FastAPI), UI (Next.js)
# Run: docker compose up -d
# Stop: docker compose down
#
# ── Passing API keys ────────────────────────────────────────────────
# Option A (CI/remote): export in shell before docker compose
#   export OPENROUTER_API_KEY=sk-or-...
#   docker compose up -d
#
# Option B (local): create .env and use --env-file
#   cp .env.example .env   # fill in keys
#   docker compose --env-file .env up -d

services:
  # ── Valkey — event bus (opt-in; falls back to in-memory when absent) ──
  # Set VALKEY_PASSWORD in .env for production; the fallback default is for local dev only.
  weebot-valkey:
    image: valkey/valkey:8-alpine
    ports: []
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-weebot_default}"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-weebot_default}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── API — FastAPI HTTP server (includes cron scheduler via lifespan) ──
  #
  # REPLICA COUNT MUST STAY 1. Do not add `deploy.replicas`, and do not run
  # this service behind a scaler. Three separate things break at two:
  #
  #   1. State is a process-local SQLite file behind one write connection and
  #      one asyncio.Lock (infrastructure/persistence/connection_pool.py:87,
  #      109, 137, 187). A second instance is a second, divergent database.
  #   2. The cron scheduler starts inside the FastAPI lifespan
  #      (interfaces/web/main.py:203-208), so every replica runs every job.
  #   3. There is no leader election anywhere -- no advisory lock, no SETNX,
  #      not even an enable flag.
  #
  # Lifting this is phase 5 of tasks/specs/arch_audit_2026_09_remediation_plan.md
  # and has a forced order: Postgres first, then extract or elect the
  # scheduler, then remove the remaining process-local assumptions. Until
  # 5.5 demonstrates two replicas with no duplicate cron execution and no
  # state divergence, this stays at one.
  weebot-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"   # FastAPI
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The image's home dir (/home/weebot) sits on the read-only root
      # filesystem. A number of modules resolve state via Path.home()
      # (profile_manager, behavior_tracker, skill_registry, gateway_auth, …),
      # so startup died with "Read-only file system: '/home/weebot'". Point
      # HOME at the writable, persistent /data volume instead.
      - HOME=/data
      - WEEBOT_WORKSPACE=/data
      - WEEBOT_LOGS_DIR=/data/logs
      - WEEBOT_SESSIONS_DB=/data/weebot_sessions.db
      - WEEBOT_MEMORY_DIR=/data/memory
      - WEEBOT_PROFILES_DIR=/data/profiles
      - BASH_TIMEOUT=${BASH_TIMEOUT:-30}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-65536}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-weebot_default}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - BROWSER_HEADLESS=true
      - WEEBOT_BACKUP_DIR=${WEEBOT_BACKUP_DIR:-}
      - WEEBOT_BACKUP_RETENTION_DAYS=${WEEBOT_BACKUP_RETENTION_DAYS:-30}
    depends_on:
      weebot-valkey:
        condition: service_healthy
    volumes:
      - weebot_data:/data
      - ./Output:/data/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── UI — Next.js frontend ─────────────────────────────────────────
  weebot-ui:
    build:
      context: .
      dockerfile: weebot-ui/Dockerfile
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://weebot-api:8000
    depends_on:
      weebot-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  weebot_data:
  valkey_data:
