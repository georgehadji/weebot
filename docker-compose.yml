# Weebot — Docker Compose
# 4 services: Valkey (event bus), API (FastAPI), UI (Next.js), Scheduler (cron jobs)
# Run: docker compose up -d
# Stop: docker compose down
#
# ── Passing API keys ────────────────────────────────────────────────
# Option A (CI/remote): export in shell before docker compose
#   export OPENROUTER_API_KEY=sk-or-...
#   docker compose up -d
#
# Option B (local): create .env and use --env-file
#   cp .env.example .env   # fill in keys
#   docker compose --env-file .env up -d

services:
  # ── Valkey — event bus (opt-in; falls back to in-memory when absent) ──
  weebot-valkey:
    image: valkey/valkey:8-alpine
    ports:
      # Expose only to other containers; don't publish to host
      # "6379:6379" removed — use internal docker network
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── API — FastAPI HTTP + MCP server ───────────────────────────────
  weebot-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"   # FastAPI
    # MCP port 5050 removed — MCP runs in-process via SSE or not at all
    environment:
      - WEEBOT_WORKSPACE=/data
      - WEEBOT_LOGS_DIR=/data/logs
      - WEEBOT_SESSIONS_DB=/data/weebot_sessions.db
      - WEEBOT_MEMORY_DIR=/data/memory
      - WEEBOT_PROFILES_DIR=/data/profiles
      - BASH_TIMEOUT=${BASH_TIMEOUT:-30}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-65536}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - BROWSER_HEADLESS=true
    depends_on:
      weebot-valkey:
        condition: service_healthy
    volumes:
      - weebot_data:/data
      - ./Output:/data/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── UI — Next.js frontend ─────────────────────────────────────────
  weebot-ui:
    build:
      context: .
      dockerfile: weebot-ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://weebot-api:8000
    depends_on:
      weebot-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Scheduler — cron job runner ───────────────────────────────────
  weebot-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["python", "-m", "weebot.scheduling.default_jobs"]
    environment:
      - WEEBOT_WORKSPACE=/data
      - WEEBOT_LOGS_DIR=/data/logs
      - WEEBOT_SESSIONS_DB=/data/weebot_sessions.db
      - WEEBOT_MEMORY_DIR=/data/memory
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - weebot_data:/data
      - ./Output:/data/output
    depends_on:
      weebot-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  weebot_data:
  valkey_data:
