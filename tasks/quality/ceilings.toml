# Container bindings that nothing ever resolves.
# The other six ratchets count things that are visibly wrong in a file. This
# one counts something that is invisible in every file: `register("llm_pool",
# ...)` reads correctly, the factory it names reads correctly, and the guard
# that would use it reads correctly -- and the bounded branch of that guard has
# never executed, because no call site passes the pool. Import-linter and the
# AST fitness suite both pass over the whole arrangement, because both answer
# "may this module reference that one" and the answer is yes.
# Three controls were in that state when this was first measured: `llm_pool`,
# `trust_report_service` and `event_pipeline`. Phase 2.3 decides each of the 18
# -- wire it or delete it -- and phase 2.4 takes this to 0.
# 18 -> 17 with phase 1.3: `llm_pool` is resolved by the container's step
# executor factory, the one ExecuteStepHandler actually runs steps with.
# 17 -> 16 with phase 2.4, and not because anything was wired: the census was
# wrong. Its resolver set had been derived from string keys only, so it never
# counted `_maybe_get(SomeType)`, the resolver for type keys, and
# EventPublisher was a false orphan.
# 16 -> 7 with phase 2.3, group 1. Nine bindings were redundant or dead --
# configure_web_clone() and configure_skill_curator() had no callers, and
# "plan_act" was a FlowRegistry entry the census counted as a binding --
# and removing the dead SkillPublisher exposed EventPublisher, its only
# consumer, as dead too.
# 7 -> 4 with phase 2.3, group 2: "idea_gate" is resolved now -- three sites
# hand-assembled the gate on the default model instead of taking the binding
# that gives its reviewers the critic and verifier tiers -- and the
# standalone "intent_review" / "main_review" bindings, which nothing used,
# are gone.
# 4 -> 0 with phase 2.3, group 3, and phase 2.4 holds it there. The last four
# were dead features, deleted with their code: trust reports (service, port,
# domain model, config field and the guarded block in CompletedState), the
# WP-4 event pipeline (a duplicate of EventPublisher's five steps plus an
# audit write that therefore never happened anywhere), the semantic task
# router, and the sandbox backend with its port.
# Measured by: scripts/lint_di_wiring.py
unresolved_di_keys = 0

