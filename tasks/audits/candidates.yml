    status: fixed
    evidence: tests/unit/test_breaker_key_and_cancelled_task.py::test_reset_clears_the_breaker_the_cascade_actually_opened
    verdict_note: >-
      VERIFIED-EXECUTED. `chat` keys the breaker on `model or self._model_name`,
      the RUNTIME model, so each cascade tier gets its own -- deliberate and
      correct, and the comment above it says so. But get_circuit_state,
