# Defect-hunt candidate inventory — the single source of truth.
#
# Phase B1 of tasks/specs/review_gate_and_residual_work_plan.md. The candidates
# were recorded as Markdown tables spread across nine audit files: readable, but
# not checkable. Nothing counted them, nothing stopped one being quietly
# dropped, and answering "what is still open?" meant re-reading nine documents —
# which is exactly what happened when the question was last asked.
#
# The audits keep their narrative. The counts come from here.
# tests/unit/test_candidate_inventory.py enforces that the two agree.
#
# status:
#   fixed     — verified defect, repaired; `evidence` names a proof test
#   cleared   — investigated, innocence established; `verdict_note` required
#   deferred  — read and consciously set aside; `verdict_note` required
#   open      — generated, never investigated
#
# A `cleared` or `deferred` record without a `verdict_note` fails the gate. That
# is the protocol's Phase 4 rule — a candidate may not be dismissed silently —
# expressed as a test rather than as a convention.

meta:
  source_of_record: tasks/audits/
  reconciliation_note: >-
    The residual-work plan's Appendix B listed 25 uninvestigated candidates.
    This inventory reports 24 not closed, and the difference is exact:
    25 - 2 (D47 fixed, D50 cleared) + 1 = 24. The one addition is D13, which
    Appendix B omitted because W2 triaged it "PARTLY DEFENDED" rather than
    leaving it uninvestigated — but its fail-open policy question was escalated,
    not answered, so it is unresolved. Converting the prose to data surfaced a
    candidate the prose count had lost, on the first run.
  numbering_gaps: [D1, D2, D7]
  numbering_gaps_note: >-
    D1, D2 and D7 appear nowhere in the audits except inside the range label
    "D1-D12" in the baseline. Either they were generated and never written down,
    or the numbering simply began at D3 and the label was loose. Prose-based
    tracking cannot tell which, and that is this file's justification in
    miniature. Recorded rather than invented: no claim is attributed to them.

