  # ── P3 — flow defects found by opening the region, not by the record ──
  - id: P3-1
    wave: P3
    location: weebot/domain/models/plan.py, weebot/application/flows/states/completed.py
    claim: "A plan whose every step FAILED reports complete, is stamped COMPLETED, and is stored as a template with success_score 1.0"
    status: fixed
    evidence: tests/unit/application/flows/test_a_failed_plan_is_not_a_success.py
    verdict_note: >-
      VERIFIED-EXECUTED, and it replaces the recorded D21 claim, which named
      the wrong mechanism. `Step.is_done()` is `COMPLETED or FAILED` — correct
      for `get_next_step()`, which must know what is still RUNNABLE, and wrong
      everywhere it was read as "succeeded". Measured: every-step-FAILED gives
      is_complete=True and a template success_score of 1.0, identical to a plan
      where everything worked. So the failure was not merely reported as a
      success, it was written to the plan-template cache with a perfect score
      and would be preferentially retrieved for the next similar task. Fixed by
      adding the missing predicates (`Plan.is_successful`, `Plan.failed_steps`)
      rather than changing `is_done()` — changing it would make a failed step
      runnable again and loop forever. `CompletedState` now scores on COMPLETED
      and ends the session `SessionStatus.FAILED` when any step failed.
      OPEN, and the user's call: `PlanStatus` has NO failure member
      (created/updated/running/completed), so the plan object still cannot say
      it failed and is stamped COMPLETED regardless. Adding one crosses into
      `weebot-ui/src/types/events.ts`, whose `PlanStatus` union is already out
      of sync with the backend (it omits `running`). `SessionStatus` was used
      instead because both stacks already understand `failed`.

