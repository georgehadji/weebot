    status: deferred
    evidence: null
    verdict_note: >-
      Real but unreachable: `is_admin` has zero callers in weebot/ or cli/, so
      reachability caps severity and no fix is warranted yet. `is_user_allowed`
      and `is_chat_allowed` both check the blocklist first; `is_admin` is the
      only accessor that does not. Deferred rather than fixed because changing
      dead code inside a security diff is exactly the unrelated-refactoring the
      protocol forbids. The first caller to use it inherits the trap, so this
      must be closed before `is_admin` is wired to anything.
  - id: D54
