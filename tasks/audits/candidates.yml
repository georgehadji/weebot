  - id: D23
    wave: W3
    location: weebot/infrastructure/watchers/
    claim: "`get_event_loop()` + `create_task` from the watchdog observer thread, swallowed"
    status: fixed
    evidence: tests/unit/test_alerting_dispatch.py::test_an_alert_fired_from_a_worker_thread_reaches_async_handlers
    verdict_note: >-
      The recorded location, weebot/infrastructure/watchers/, DOES NOT EXIST, and
      the note said "generated and read; not triggered within W3's budget" -- so
      the candidate named a directory rather than a site and was never verified.
      An AST sweep for the actual shape (asyncio.get_event_loop() plus
      create_task/ensure_future inside a SYNCHRONOUS function) found exactly one
      instance in 821 files: AlertManager._dispatch in weebot/core/alerting.py.
      Verified by execution -- from the loop thread it worked and delivered 1; from
      a worker thread and from a plain script it raised "RuntimeError: There is no
      current event loop in thread ..." and delivered 0. The raise came from
      `loop = asyncio.get_event_loop()`, a variable the function NEVER READ, and
      it happened inside fire_alert while holding the RLock, after the synchronous
      handlers had already run: a partial dispatch and an exception, from a dead
      assignment, in a class whose docstring says "Thread-safe for concurrent
      access". ensure_future was the other half -- not thread-safe, and the task it
      returned was dropped, so a failing handler was never heard from. Fixed with
      the same pattern as D51: an optional bound loop, get_running_loop when there
      is one, run_coroutine_threadsafe when there is not, an explicit ERROR when
      no loop exists at all so an undeliverable alert is never silent, and a
      done-callback that retrieves each handler's exception. 30 threads firing
      concurrently now deliver 30 alerts.

