      unobserved -- the telemetry for a dangerous command may never be written
      and nothing reports it. That is a monitoring gap, not a guard defect, and
      it belongs to whoever owns the security-event sink.
  - id: D55
    wave: P2
    location: weebot/config/fs_permissions.py:82-95; weebot/tools/file_editor.py:140
    claim: >-
      A filesystem policy file that exists but does not parse is treated as no
      policy at all, so one bad indent silently disables every deny rule
    status: fixed
    evidence: tests/unit/config/test_fs_policy_fail_closed.py
    verdict_note: >-
      `load_rules` returned [] both when the file was absent -- the documented
      default, where allow-by-default is deliberate -- and when it existed but
      could not be read. `file_editor.execute` skips the entire gate on
      `if _perm.has_rules:`, so a two-rule deny policy with one missing space
      allowed every read and write with a WARNING as the only trace. Proven:
      the valid policy enforced 2 rules, the same file with one bad indent
      enforced 0. Two further shapes raised AttributeError out of the loader
      because `data.get("rules")` sat outside the try -- valid YAML that is a
      bare list or scalar. The codebase already states the right principle in
      two places: PermissionMode says a caller with no approval path "MUST fail
      closed", and file_editor's interrupt branch reasons that treating an
      unanswered gate as permission inverts the rule's intent. A policy that
      cannot be loaded is an unanswered gate. Now raises FSPolicyUnreadable and
      installs a deny-everything rule set, logged at ERROR. A zero-byte file --
      what a truncated write leaves behind -- also fails closed, while an
