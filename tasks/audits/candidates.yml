  - id: D29
    wave: W3
    location: weebot/application/flows/
    claim: "`t.exception()` in a done-callback raises `CancelledError`"
    status: fixed
    evidence: tests/unit/test_breaker_key_and_cancelled_task.py::test_cancelling_a_session_does_not_raise_in_the_done_callback
    verdict_note: >-
      The note said "generated and read; not triggered within W3's budget", and
      the location named a directory. Located precisely: there are two
      `.exception()` calls in weebot/ and cli/, and only ONE is unguarded --
      task_runner.py:142. The other, _cascade.py:463, already checks
      `if not pf.cancelled()` inside contextlib.suppress(InvalidStateError,
      CancelledError) and is correct. Verified by execution: `Task.exception()`
      RAISES CancelledError on a cancelled task, so the unguarded form pushed
      ['CancelledError'] into the loop's exception handler while the guarded form
      pushed []. Cancelling a session is an ordinary operation -- `flow cancel
      <id>` is a CLI command -- so this fired on a normal path. Severity LOW: the
      pops above it have already run, so no state is corrupted; the harm is that
      a real cleanup failure is now one more CancelledError in a stream of
      identical noise. Fixed by returning early on `t.cancelled()` (logging at
      DEBUG, since a cancellation is still worth a line) and by calling
      `t.exception()` once instead of twice.
  - id: S5
    wave: W3
    location: weebot/application/flows/
    claim: "Both declared transition tables are dead code — the architecture documents a machine that does not execute"
    status: fixed
    evidence: tests/unit/test_architecture_fitness.py
    verdict_note: >-
      TRUE and understated: there were THREE, not two. state_graph.py's
      build_default_state_graph, flow_state_machine.py's _TRANSITION_TABLE, and
      FlowSerializer.to_langgraph -- a hardcoded four-node description of a
      thirteen-state machine. VERIFIED: zero external callers for every one of
      them; FlowRouter._get_graph had no caller anywhere in weebot/, cli/,
      tests/ or scripts/, and _route_product_gate / _route_plan_approval
      existed only to feed the graph. Against them stood 45
      context.set_state(...) calls and one if/elif chain, which is what ran.
      .
      Not merely dead weight. The graph had diverged from the live router in
      six measured ways, the worst being that a DECLINING answer at a security
      gate routes to ExecutingState under the graph -- the entire ADR 006
      refusal path vanishes -- and an empty answer becomes consent. And
      scripts/wire_stategraph.py existed to swap one for the other. Run against
      a copy of the tree, it printed "StateGraph wired into
      FlowRouter.resolve_initial_state()", EXITED 0, wired nothing
      (`graph.resolve` occurrences: 0), and duplicated both the import and
      _get_graph (1 -> 2 each). A tool that reports success while corrupting
      the file it edits is the same defect class as the tables themselves.
      .
      Fixed by deletion: 359 lines across three files, plus _get_graph,
      _state_class_map, the two _route_* helpers and to_langgraph. Chosen over
      wiring the graph (highest blast radius -- the resume path for every
      session, and ProductGateState(resume_with=prompt) cannot be expressed by
      a name-returning factory) and over a conformance test (which would pin
      current behaviour including the shared extra-wipe bug, and a dead table
      with a green test is more misleading, not less). New gate
      test_there_is_exactly_one_flow_routing_table keeps them deleted; proven
      to fire by recreating state_graph.py.

