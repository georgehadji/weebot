  - id: D52
    wave: P1
    location: weebot/core/gateway_auth.py:36,54; weebot/core/egress_guard.py:208,220
    claim: >-
      Security-control state is written with a truncating write and reloaded
      through a handler that silently substitutes defaults, so one interrupted
      write permanently erases an operator's allowlist and blocklist
    status: fixed
    evidence: tests/unit/core/test_security_state_durability.py
    verdict_note: >-
      Two halves of one root cause. `Path.write_text` truncates before writing,
      so a write that dies partway destroys the previous contents; `_load` then
      answers the parse failure with defaults, and the next administrative
      action saves those defaults over the unreadable file. Proven by trigger:
      a half-completed save left the gateway config unparseable, and a
      previously approved egress recipient was simply gone with the failure
      logged and swallowed. Fixed with an atomic replace and by preserving the
      unreadable file as *.corrupt.bak -- a rule .gitignore already carried for
      a convention nothing implemented. The RAR invalid-input vector then found
      a second, pre-existing half: `[]`, `"text"`, `null` and
      `{"allowed_platforms": null}` are all valid JSON and all raised
      AttributeError/TypeError out of the authorization decision itself, so
      `_load` now validates shape. The first draft of that validation was
      itself fail-open -- a `setdefault` pass put the rejected value straight
      back -- which is pinned by its own regression test.
  - id: D53
    wave: P1
    location: weebot/core/gateway_auth.py:94
    claim: >-
