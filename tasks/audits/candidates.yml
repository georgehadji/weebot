  - id: D12
    wave: W1
    location: weebot/application/flows/states/executing.py
    claim: "The inbound-mail approval flag is cleared before the pause"
    status: fixed
    evidence: tests/unit/application/flows/test_user_gate_answer_is_honoured.py
    verdict_note: >-
      The claim as written is REFUTED and the clearing is correct: the flag is
      cleared inside `if _mail_ap.requires_confirmation:`, immediately before
      set_status(WAITING) and the WaitForUserEvent yield, and it must be --
      FlowRouter flips WAITING -> RUNNING and re-enters execute() against the
      SAME step, so an uncleared flag re-fires forever. The constraint gate
      below it carries a comment saying exactly this.
      .
      W1's [UNK] on the resume path was right to be suspicious, and the defect
      there is real. VERIFIED-STATIC: resolve_initial_state has three routing
      priorities. `_product_gate_pending` forwards the user's prompt to
      ProductGateState(resume_with=prompt). `plan_pending_approval` tests it
      against _APPROVE_TOKENS and routes to PlanningState with a modification
      request when it is not an approval. Everything else -- including every
      session that paused at this gate -- falls to `if last_plan is not None and
      not last_plan.is_complete(): return ExecutingState(), session`, which
      never reads `prompt` at all. The gate asks "type 'proceed' to continue, or
      describe how you'd like to handle it" and honours NEITHER branch: the
      description is discarded and there is no way to decline. Execution of the
      untrusted inbound content proceeds identically whatever the user typed.
      The constraint gate immediately below has the same structure and the same
      hole, so one defect covers two gates.
      .
      FIXED after the user green-lit the semantic choice, which was escalated
      first because it is a product decision rather than a defect: what a
      non-approval should DO. It follows the codebase's own precedent for the
      identical situation -- the plan-approval path re-plans with the response
      as a modification request -- so both gates now do that. Both mark
      `_user_gate_pending` in context.extra via _mark_user_gate before pausing,
      and resolve_initial_state gained Priority 2, between plan approval and the
      generic resume, which reads the answer. One deliberate divergence from the
      plan-approval precedent: an EMPTY response is not approval here. That path
      accepts it as one; these gates guard untrusted input and stated
      constraints, and silence is not consent.
      .
      Approval does NOT short-circuit to ExecutingState. It clears the flag and
      falls through to the pre-existing resume branches, which check that a plan
      exists and is incomplete first. The short-circuit was written and then
      removed: a test caught it returning ExecutingState for a session with no
      plan to execute, a state the router could not previously produce.
      .
      Confirmed while fixing: set_fact writes to context.facts, which
      SessionContext.get does NOT read -- it reads declared fields then
      context.extra. A test pins this both ways, because it is the reason the
      gates' own pending flags could not have been used for routing.
      context.facts is also capped at 100 entries with oldest-first eviction.
      Red before green: 30 failed / 3 passed with the router reverted, 33 pass
      with it. The 3 are the flag-visibility tests and the no-gate regression,
      correctly unaffected.

