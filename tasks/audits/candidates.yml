      could invoke under any arguments, including none. Fixed by replaying the
      tool's own `.parameters` schema as a keyword-only signature, which is the
      only channel the SDK reads; omitted optionals are stripped so execute()
      sees what was sent, matching `_run_file_tool`'s existing convention.
      Reach is DEAD -- no caller anywhere passes `dynamic_tools`, so severity is
      capped and no current behaviour changes. Validation now happens and is the
      tool's own: a missing required arg and a wrong-typed arg are both rejected
      by name.

