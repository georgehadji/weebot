    status: fixed
    evidence: tests/unit/test_degraded_results_are_marked.py::test_an_evaluator_outage_is_marked_not_disguised
    verdict_note: >-
      PARTLY DEFENDED, and the defended part was left alone. W2 escalated whether
      a verification gate should fail open as a product decision, and that policy
      is UNCHANGED: an evaluator outage still returns passed=True and the step
      still proceeds, asserted by a control test so a later edit cannot quietly
      decide the question. What is fixed is the separate defect underneath it:
      score=1.0 is the maximum, byte-identical to a step judged perfect, and
      StepEvaluation had no field that could say otherwise -- so the fail-open
      was not merely permissive, it was invisible. The live consumer at
      flows/states/executing.py only logged on `not passed`, and a failed
      evaluator returns passed=True, so an outage silently disabled the progress
      gate for every step with nothing in the log at all. Added
      `evaluator_failed: bool = False` (additive, so every honest verdict is
      unchanged), set on the exception and empty-completion paths, and a warning
      at the call site naming the step and the reason. Whatever the policy
      decision turns out to be, it needs this distinction to be answerable.

