    evidence: tests/unit/test_behavior_ledger_git.py::test_a_filesystem_event_reaches_the_websocket_broadcast
    verdict_note: >-
      The recorded mechanism was WRONG and execution corrected it. `_tracker_tasks`
      never grows, because `asyncio.get_event_loop()` raises RuntimeError ("no
      current event loop in thread 'Thread-1'") on the watchdog observer thread,
      before the append. Measured: 6 filesystem events produced 0 broadcasts, 0
      appended tasks and 6 RuntimeErrors swallowed at DEBUG. So the defect is not
      an unbounded list, it is that the behaviour WebSocket has never delivered a
      single event -- a client sees the `connected` frame and its own pongs and
      nothing else. `loop.create_task` would have been wrong regardless: it is not
      thread-safe. Fixed by capturing the running loop in the enclosing async
      function and using `asyncio.run_coroutine_threadsafe`, with a done-callback
      that discards the future and retrieves its exception, so the tracking set
      cannot grow without bound either. Reach: `behavior_router.start_session_tracking`
      has zero callers -- the live path is `weebot/core/behavior_integration.py` --
      so severity stays capped and nothing changes behaviour today. 200 events
      fired from a foreign thread now deliver 200 broadcasts.

