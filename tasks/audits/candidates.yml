  - id: D8
    wave: W1
    location: weebot/infrastructure/security/state_verifier.py:501
    claim: "Raw `create_subprocess_shell` outside the bash-guard path"
    status: fixed
    evidence: tests/unit/infrastructure/security/test_verification_does_not_re_execute.py
    verdict_note: >-
      Confirmed and much worse than the claim. The recorded path had moved to
      weebot/infrastructure/security/, and it was the ONLY shell-execution site
      in weebot/ or cli/ -- zero `shell=True`, zero `os.system`. What it did:
      `verify_command_execution` took an agent's CLAIM that it had run a
      command and, for anything it judged critical, RE-RAN that command to
      compare return codes. Measured: given a claim about `rm -f <marker>`, the
      marker existed before verification and did not exist after, and the
      verifier then reported CONTRADICTED because the second run's return code
      differed from the first. `rm -rf /` reached the same call; BashGuard rates
      it BLOCKED and nothing on this path consulted BashGuard. Classification
      was substring matching, so `terraform apply` and `echo confirm` were
      "critical" ("rm" is inside "terraform" and "confirm") and therefore
      re-executed; `curl -X POST .../charge` was critical and guard-SAFE, so it
      would have been replayed. And when re-execution raised, the handler logged
      a warning and fell through to VERIFIED at confidence 0.9. Reach is DEAD --
      StateVerifier has no importer in weebot/, cli/, tests/ or scripts/ -- so
      none of it ran, and severity is capped. Fixed by not re-executing at all
      (UNVERIFIABLE at confidence 0.0 is the honest result for a claim you
      decline to reproduce), word-boundary classification, and deleting
      `_execute_verify_command`, which takes the codebase's shell-execution
      surface to zero. New ceiling-zero gate
      test_no_shell_execution_outside_the_bash_guard enforces CLAUDE.md rule 3,
      which until now had no enforcement anywhere.

